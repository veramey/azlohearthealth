name: AI Teammate

run-name: "Issue #${{ inputs.issue_number || github.event.issue.number }} : AI implementation"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number to implement'
        required: true
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-teammate:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'tests-ready' && contains(github.event.issue.labels.*.name, 'sub-issue'))
    # Fix #11: Serialize implementations to prevent merge conflicts between sub-issues
    concurrency:
      group: ai-teammate-serial
      cancel-in-progress: false

    steps:
      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Job Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "AI Teammate (Developer) Started"
          echo "Issue: #${{ steps.issue.outputs.number }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: npm  # Re-enable after package-lock.json exists

      - name: Install dependencies
        run: npm ci --no-audit --progress=false 2>/dev/null || echo "No package.json yet — skipping npm ci"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Git Author
        run: |
          git config --global user.name "AI Teammate"
          git config --global user.email "agent.ai.native@gmail.com"

      - name: Move issue to In progress
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          chmod +x scripts/add-to-project.sh scripts/update-project-status.sh
          ./scripts/add-to-project.sh ${{ steps.issue.outputs.number }} "In progress" || true
          ./scripts/update-project-status.sh ${{ steps.issue.outputs.number }} "In progress" || true

      - name: Fetch GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p input output
          gh issue view ${{ steps.issue.outputs.number }} \
            --repo ${{ github.repository }} \
            > input/issue.md
          echo "Issue fetched:"
          cat input/issue.md

      # Fix #6: Don't re-create branch if PR already exists (avoids overwriting rework commits)
      - name: Check for existing PR
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="feature/issue-${{ steps.issue.outputs.number }}"
          EXISTING_PR=$(gh pr list \
            --repo ${{ github.repository }} \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH — skipping to avoid overwriting rework"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Create feature branch
        if: steps.existing_pr.outputs.skip != 'true'
        run: |
          BRANCH="feature/issue-${{ steps.issue.outputs.number }}"
          git checkout -b $BRANCH
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Run Claude Code
        if: steps.existing_pr.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CONTEXT=$(cat .claude/agents/common/project-context.md)
          QUALITY=$(cat .claude/agents/common/quality-rules.md)
          DESIGN=$(cat .claude/agents/common/design-system.md)
          AGENT_PROMPT=$(cat .claude/agents/developer.md)
          claude --dangerously-skip-permissions --model claude-sonnet-4-6 -p "
          # Project Context
          $CONTEXT

          # Design System
          $DESIGN

          # Quality Rules
          $QUALITY

          # Agent Instructions
          $AGENT_PROMPT

          ## Task
          Read the GitHub issue in input/issue.md and implement the requested feature.
          Write a short summary to output/summary.md.
          Start now.
          "

      - name: Commit changes
        if: steps.existing_pr.outputs.skip != 'true'
        run: |
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "feat: implement issue #${{ steps.issue.outputs.number }}

          Implemented by AI Teammate via Claude Code.
          Closes #${{ steps.issue.outputs.number }}"

      - name: Push branch
        if: steps.existing_pr.outputs.skip != 'true'
        run: git push origin $BRANCH

      - name: Create Pull Request
        if: steps.existing_pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SUMMARY=""
          if [ -f output/summary.md ]; then
            SUMMARY=$(cat output/summary.md)
          fi

          gh pr create \
            --repo ${{ github.repository }} \
            --title "feat: issue #${{ steps.issue.outputs.number }}" \
            --body "$(cat <<EOF
          ## Summary
          $SUMMARY

          Closes #${{ steps.issue.outputs.number }}

          ---
          Implemented by AI Teammate (Claude Code)
          EOF
          )" \
            --base main \
            --head $BRANCH || true

      - name: Move issue to In review
        if: steps.existing_pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ./scripts/update-project-status.sh ${{ steps.issue.outputs.number }} "In review" || true

