name: Close Parent Issue

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-parent:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Move closed issue to Done
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          chmod +x scripts/update-project-status.sh
          ./scripts/update-project-status.sh "${{ github.event.issue.number }}" "Done" || true

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Check if all sub-issues are closed
        id: check
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PARENT_NUM=$(gh issue view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json body --jq '.body' \
            | grep -oP 'Parent:\s*#\K[0-9]+' | head -1)

          if [ -z "$PARENT_NUM" ]; then
            echo "No parent issue found — skipping"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PARENT_STATE=$(gh issue view $PARENT_NUM \
            --repo ${{ github.repository }} \
            --json state --jq '.state')

          if [ "$PARENT_STATE" != "OPEN" ]; then
            echo "Parent #$PARENT_NUM already $PARENT_STATE — skipping"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          OPEN_SUBS=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "sub-issue" \
            --state open \
            --limit 100 \
            --json number,body \
            --jq "[.[] | select(.body | test(\"Parent:\\\\s*#${PARENT_NUM}\"))] | length")

          echo "Open sub-issues remaining: $OPEN_SUBS"

          if [ "$OPEN_SUBS" != "0" ]; then
            echo "Still $OPEN_SUBS open — not ready"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "PARENT_NUM=$PARENT_NUM" >> $GITHUB_ENV
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Collect verification context
        if: steps.check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p input

          echo "## Parent Issue" > input/verify_context.md
          gh issue view $PARENT_NUM \
            --repo ${{ github.repository }} \
            >> input/verify_context.md

          echo "" >> input/verify_context.md
          echo "## Closed Sub-Issues" >> input/verify_context.md
          gh issue list \
            --repo ${{ github.repository }} \
            --label "sub-issue" \
            --state closed \
            --limit 100 \
            --json number,title,body \
            --jq ".[] | select(.body | test(\"Parent:\\\\s*#${PARENT_NUM}\")) | \"### #\\(.number): \\(.title)\\n\\(.body)\"" \
            >> input/verify_context.md

          echo "" >> input/verify_context.md
          echo "## Recent merged PRs" >> input/verify_context.md
          git log --oneline -20 >> input/verify_context.md

          # Fix #7: Collect diffs from actual merged PRs for this parent's sub-issues
          echo "" >> input/verify_context.md
          echo "## Git diff from merged sub-issue PRs" >> input/verify_context.md

          # Find merge commits for feature/issue-N branches related to sub-issues
          gh issue list \
            --repo ${{ github.repository }} \
            --label "sub-issue" \
            --state closed \
            --limit 100 \
            --json number,body \
            --jq ".[] | select(.body | test(\"Parent:\\\\s*#${PARENT_NUM}\")) | .number" \
            | while read SUB_NUM; do
              MERGE_SHA=$(gh pr list \
                --repo ${{ github.repository }} \
                --head "feature/issue-${SUB_NUM}" \
                --state merged \
                --json mergeCommit \
                --jq '.[0].mergeCommit.oid' 2>/dev/null || echo "")
              if [ -n "$MERGE_SHA" ] && [ "$MERGE_SHA" != "null" ]; then
                echo "### Sub-issue #${SUB_NUM} (merge: ${MERGE_SHA:0:8})" >> input/verify_context.md
                git diff "${MERGE_SHA}^" "$MERGE_SHA" -- app/ components/ services/ stores/ hooks/ types/ constants/ utils/ >> input/verify_context.md 2>/dev/null || true
              fi
            done

          # Fallback: if no merge SHAs found, use HEAD~10
          if ! grep -q "### Sub-issue" input/verify_context.md; then
            echo "(Fallback: recent diff)" >> input/verify_context.md
            git diff HEAD~10 HEAD -- app/ components/ services/ stores/ hooks/ types/ constants/ utils/ >> input/verify_context.md 2>/dev/null || true
          fi

      - name: Run Claude — verify acceptance criteria
        if: steps.check.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CONTEXT=$(cat .claude/agents/common/project-context.md)
          AGENT_PROMPT=$(cat .claude/agents/qa-verifier.md)
          claude --dangerously-skip-permissions --model claude-sonnet-4-6 -p "
          # Project Context
          $CONTEXT

          # Agent Instructions
          $AGENT_PROMPT

          ## Task
          Read input/verify_context.md — it contains the parent issue, closed sub-issues, and git diffs.
          Use PARENT_NUM=$PARENT_NUM and REPO=$REPO.
          Start by reading input/verify_context.md carefully.
          "

      - name: Move parent to Done
        if: steps.check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          chmod +x scripts/update-project-status.sh
          ./scripts/update-project-status.sh "$PARENT_NUM" "Done" || true

