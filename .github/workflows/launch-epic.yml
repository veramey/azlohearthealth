name: Launch Epic — Create Issue from Epic Doc

on:
  workflow_dispatch:
    inputs:
      epic_file:
        description: 'Epic filename (e.g. 01-scaffolding.md)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  launch:
    runs-on: ubuntu-latest

    steps:
      - name: Job Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Launch Epic"
          echo "File: context/epics/${{ inputs.epic_file }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Validate epic file exists
        id: validate
        run: |
          EPIC_PATH="context/epics/${{ inputs.epic_file }}"

          if [ ! -f "$EPIC_PATH" ]; then
            echo "File not found: $EPIC_PATH"
            echo "Available epics:"
            ls -1 context/epics/*.md 2>/dev/null || echo "  (none)"
            exit 1
          fi

          if [ "${{ inputs.epic_file }}" = "00-overview.md" ]; then
            echo "00-overview.md is the index — not an epic. Pick a specific epic file."
            exit 1
          fi

          echo "epic_path=$EPIC_PATH" >> $GITHUB_OUTPUT

      - name: Check for duplicate issue
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Extract title from epic file (first H1)
          TITLE=$(grep -m1 '^# ' "context/epics/${{ inputs.epic_file }}" | sed 's/^# //')

          # Check if issue with this title already exists
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --search "\"$TITLE\" in:title" \
            --state all \
            --json number \
            --jq 'length')

          if [ "$EXISTING" != "0" ]; then
            echo "Issue '$TITLE' already exists — skipping"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "TITLE=$TITLE" >> $GITHUB_ENV
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub issue
        if: steps.dedup.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          EPIC_PATH="context/epics/${{ inputs.epic_file }}"

          # Ensure labels exist
          gh label create "bootstrap" --color "5319e7" --description "Created by Bootstrap Agent" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "feature" --color "a2eeef" --description "Feature request" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "needs-design" --color "d876e3" --description "Needs design requirements" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "intake-done" --color "e4e669" --description "Issue structured by Intake Agent" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "P0-critical" --color "b60205" --description "Priority: Critical" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "P1-high" --color "d93f0b" --description "Priority: High" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "P2-medium" --color "fbca04" --description "Priority: Medium" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "P3-low" --color "0e8a16" --description "Priority: Low" \
            --repo ${{ github.repository }} 2>/dev/null || true

          # Build labels
          LABELS="feature,bootstrap"

          # Extract priority from file
          PRIORITY=$(sed -n '/^## Priority/,/^## /p' "$EPIC_PATH" | grep -oE 'P[0-3]-(critical|high|medium|low)' | head -1 || echo "")
          if [ -n "$PRIORITY" ]; then
            LABELS="${LABELS},${PRIORITY}"
          fi

          # Check if design is required
          if grep -qi "Design Required.*Yes" "$EPIC_PATH" || grep -qi "^Yes" "$EPIC_PATH"; then
            LABELS="${LABELS},needs-design"
          fi

          # Create issue body from epic file
          printf '%s\n\n---\n_Created from `%s` by Launch Epic workflow_' \
            "$(cat "$EPIC_PATH")" "${{ inputs.epic_file }}" > /tmp/issue_body.md

          # Create issue WITHOUT intake-done
          ISSUE_URL=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "$TITLE" \
            --body-file /tmp/issue_body.md \
            --label "$LABELS")

          ISSUE_NUM=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "Created issue #${ISSUE_NUM}: ${TITLE}"

          # Add to project board
          if [ -f scripts/add-to-project.sh ]; then
            chmod +x scripts/add-to-project.sh
            ./scripts/add-to-project.sh "$ISSUE_NUM" "Backlog" || true
          fi

          # Now add intake-done to trigger pipeline (labeled event)
          sleep 2
          gh issue edit "$ISSUE_NUM" \
            --repo ${{ github.repository }} \
            --add-label "intake-done"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Issue #${ISSUE_NUM} created and pipeline triggered"
          echo "$ISSUE_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
