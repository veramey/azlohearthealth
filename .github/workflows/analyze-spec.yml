name: Analyze SPEC — Create Epic Documents

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    concurrency:
      group: analyze-spec
      cancel-in-progress: false

    steps:
      - name: Job Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "SPEC Analyzer Agent Started"
          echo "Reading SPEC.md → creating epic documents"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check if epics already exist
        id: dedup
        run: |
          if [ -d "context/epics" ] && [ "$(ls -A context/epics/ 2>/dev/null)" ]; then
            echo "context/epics/ already has files — skipping to prevent overwrite"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Claude Code CLI
        if: steps.dedup.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude — analyze SPEC and create epic docs
        if: steps.dedup.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p context/epics

          CONTEXT=$(cat .claude/agents/common/project-context.md)
          AGENT_PROMPT=$(cat .claude/agents/spec-analyzer.md)
          claude --dangerously-skip-permissions --model claude-opus-4-6 -p "
          # Project Context
          $CONTEXT

          # Agent Instructions
          $AGENT_PROMPT

          ## Task
          Read context/SPEC.md carefully — every section, every table, every edge case.
          Create epic documents in context/epics/ directory.
          Start with 00-overview.md, then individual epic files (01-xxx.md, 02-xxx.md, etc.).
          Write files directly — do not output to stdout.
          "

      - name: Validate output
        if: steps.dedup.outputs.proceed == 'true'
        id: validate
        run: |
          if [ ! -f "context/epics/00-overview.md" ]; then
            echo "Missing 00-overview.md — agent failed"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          COUNT=$(ls -1 context/epics/*.md 2>/dev/null | wc -l)
          echo "Created $COUNT epic documents"

          if [ "$COUNT" -lt 6 ]; then
            echo "Too few epics ($COUNT) — expected at least 6"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "valid=true" >> $GITHUB_OUTPUT
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Epic documents:"
          ls -la context/epics/
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit and push epic documents
        if: steps.dedup.outputs.proceed == 'true' && steps.validate.outputs.valid == 'true'
        run: |
          git config user.name "AI Teammate"
          git config user.email "agent.ai.native@gmail.com"
          git add context/epics/
          git commit -m "docs: add MVP epic documents from SPEC.md analysis

          Created by SPEC Analyzer Agent (Claude Code, Opus)."
          git push origin main

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Epic documents committed and pushed to main"
          echo "Pull to review: git pull origin main"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
