name: Test Cases Generator

run-name: "Test Cases #${{ github.event.issue.number }} : generate QA plan"

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  test-cases:
    runs-on: ubuntu-latest
    if: |
      github.event.label.name == 'ready' &&
      contains(github.event.issue.labels.*.name, 'sub-issue')

    # Fix #11: Serialize sub-issue processing to prevent cascade
    concurrency:
      group: test-cases-pipeline
      cancel-in-progress: false

    steps:
      - name: Job Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Test Cases Generator Started"
          echo "Issue: #${{ github.event.issue.number }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Fix #11: WIP limit — max 2 issues in tests-ready at once
      - name: Check WIP limit for tests-ready
        id: wip
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          IN_PROGRESS=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "tests-ready" \
            --state open \
            --json number \
            --jq 'length')

          echo "Issues currently in tests-ready or later: $IN_PROGRESS"

          if [ "$IN_PROGRESS" -ge 3 ]; then
            echo "WIP limit reached (3) — will queue via concurrency group"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write issue to file
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p input output
          gh issue view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} > input/issue.md

      - name: Run Claude — generate test cases
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CONTEXT=$(cat .claude/agents/common/project-context.md)
          QUALITY=$(cat .claude/agents/common/quality-rules.md)
          AGENT_PROMPT=$(cat .claude/agents/test-cases.md)
          claude --dangerously-skip-permissions --model claude-sonnet-4-6 -p "
          # Project Context
          $CONTEXT

          # Quality Rules
          $QUALITY

          # Agent Instructions
          $AGENT_PROMPT

          ## Task
          Read input/issue.md — it contains the feature to be built including acceptance criteria.
          Output to output/test_cases.md.
          "

      - name: Append test cases and promote
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Fix #8: Silent failure — flag if Claude produced no output
          if [ ! -f output/test_cases.md ] || [ ! -s output/test_cases.md ]; then
            echo "Claude produced no output — adding pipeline-error"
            gh label create "pipeline-error" --color "d73a4a" --description "Workflow failure" \
              --repo ${{ github.repository }} 2>/dev/null || true
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --add-label "pipeline-error"
            exit 1
          fi

          CURRENT_BODY=$(gh issue view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --json body -q '.body')

          printf '%s\n\n%s\n\n---\n_Test cases generated by QA Agent (Claude Code)_' \
            "$CURRENT_BODY" "$(cat output/test_cases.md)" > output/new_body.txt

          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body-file output/new_body.txt

          gh label create "tests-ready" --color "006b75" --description "Test cases generated, ready for implementation" \
            --repo ${{ github.repository }} 2>/dev/null || true

          # Promote: remove ready, add tests-ready
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "ready" \
            --add-label "tests-ready" 2>/dev/null || \
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "tests-ready"

          echo "Test cases added — issue promoted to tests-ready"
