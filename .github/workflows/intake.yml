name: Intake Agent

run-name: "Intake #${{ github.event.issue.number }} : structure issue"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.issue.labels.*.name, 'sub-issue') &&
      !contains(github.event.issue.labels.*.name, 'intake-done') &&
      !contains(github.event.issue.labels.*.name, 'bootstrap') &&
      !contains(github.event.issue.labels.*.name, 'bug')

    steps:
      - name: Job Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Intake Agent Started"
          echo "Issue: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write issue to file
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p input output
          gh issue view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            > input/issue.md
          cat input/issue.md

      - name: Run Claude — structure issue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CONTEXT=$(cat .claude/agents/common/project-context.md)
          AGENT_PROMPT=$(cat .claude/agents/intake.md)
          claude --dangerously-skip-permissions --model claude-opus-4-6 -p "
          # Project Context
          $CONTEXT

          # Agent Instructions
          $AGENT_PROMPT

          ## Task
          Read the GitHub issue in input/issue.md and SPEC.md.
          Output ONLY the new issue body to output/structured_issue.md.
          "

      - name: Update issue body and apply labels
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Fix #8: Silent failure — flag if Claude produced no output
          if [ ! -f output/structured_issue.md ] || [ ! -s output/structured_issue.md ]; then
            echo "Claude produced no output — adding pipeline-error"
            gh label create "pipeline-error" --color "d73a4a" --description "Workflow failure" \
              --repo ${{ github.repository }} 2>/dev/null || true
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --add-label "pipeline-error"
            exit 1
          fi

          printf '%s\n\n---\n_Structured by Intake Agent (Claude Code)_' \
            "$(cat output/structured_issue.md)" > output/new_body.txt

          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body-file output/new_body.txt

          # Ensure labels exist
          gh label create "intake-done" --color "e4e669" --description "Issue structured by Intake Agent" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "feature" --color "a2eeef" --description "Feature request" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "needs-design" --color "d876e3" --description "Needs design requirements" \
            --repo ${{ github.repository }} 2>/dev/null || true

          # Fix #3: Extract priority only from ## Priority section to avoid false matches
          PRIORITY=$(sed -n '/^## Priority/,/^## /p' output/structured_issue.md | grep -oE 'P[0-3]-(critical|high|medium|low)' | head -1 || echo "")
          if [ -n "$PRIORITY" ]; then
            gh label create "$PRIORITY" --color "e4e669" --description "Priority: $PRIORITY" \
              --repo ${{ github.repository }} 2>/dev/null || true
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --add-label "$PRIORITY"
          fi

          # Check if design is required
          if grep -qi "Design Required.*Yes" output/structured_issue.md; then
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --add-label "needs-design"
          fi

          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "intake-done,feature"

          # Add to project board — intake done, ready for architecture
          chmod +x scripts/add-to-project.sh scripts/update-project-status.sh
          ./scripts/add-to-project.sh ${{ github.event.issue.number }} "Ready for Architecture" || true
          ./scripts/update-project-status.sh ${{ github.event.issue.number }} "Ready for Architecture" || true

          echo "Issue structured and labeled intake-done"
