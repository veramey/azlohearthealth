name: Pipeline Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-monitor
      cancel-in-progress: true

    steps:
      - name: Job Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Pipeline Monitor Started"
          echo "Time: $(date -u)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Fix #5: Early exit if pipeline is empty — save budget
      - name: Check if pipeline has work
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          OPEN_ISSUES=$(gh issue list --repo ${{ github.repository }} --state open --json number --jq 'length')
          OPEN_PRS=$(gh pr list --repo ${{ github.repository }} --state open --json number --jq 'length')

          echo "Open issues: $OPEN_ISSUES, Open PRs: $OPEN_PRS"

          if [ "$OPEN_ISSUES" = "0" ] && [ "$OPEN_PRS" = "0" ]; then
            echo "Pipeline is empty — nothing to monitor"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.precheck.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Claude Code CLI
        if: steps.precheck.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect pipeline context
        if: steps.precheck.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p input

          echo "## Open Issues" > input/pipeline_context.md
          gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --json number,title,labels,updatedAt \
            --jq '.[] | "Issue #\(.number): \(.title) | labels: \([.labels[].name] | join(", ")) | updated: \(.updatedAt)"' \
            >> input/pipeline_context.md

          echo "" >> input/pipeline_context.md
          echo "## Open Pull Requests" >> input/pipeline_context.md
          gh pr list \
            --repo ${{ github.repository }} \
            --state open \
            --json number,title,headRefName,labels,updatedAt \
            --jq '.[] | "PR #\(.number): \(.title) | branch: \(.headRefName) | labels: \([.labels[].name] | join(", ")) | updated: \(.updatedAt)"' \
            >> input/pipeline_context.md

          echo "" >> input/pipeline_context.md
          echo "## Recent Workflow Runs (last 30)" >> input/pipeline_context.md
          gh run list \
            --repo ${{ github.repository }} \
            --limit 30 \
            --json databaseId,displayTitle,workflowName,status,conclusion,headBranch,createdAt \
            --jq '.[] | "[\(.workflowName)] \(.displayTitle) | branch: \(.headBranch) | \(.status) \(.conclusion) | \(.createdAt)"' \
            >> input/pipeline_context.md

          echo "" >> input/pipeline_context.md
          echo "## Current UTC time" >> input/pipeline_context.md
          echo "$(date -u)" >> input/pipeline_context.md

          cat input/pipeline_context.md

      - name: Reconcile board statuses
        if: steps.precheck.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x scripts/reconcile-board-status.sh scripts/update-project-status.sh

          # Reconcile all open issues
          gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --json number --jq '.[].number' \
            | while read -r NUM; do
              echo "--- Reconciling issue #$NUM ---"
              ./scripts/reconcile-board-status.sh "$NUM" || echo "Failed to reconcile #$NUM — continuing"
            done

          # Also reconcile recently closed issues (last 24h) that may have stale board status
          gh issue list \
            --repo ${{ github.repository }} \
            --state closed \
            --json number,closedAt \
            --jq "[.[] | select((.closedAt | fromdateiso8601) > (now - 86400))] | .[].number" \
            | while read -r NUM; do
              echo "--- Reconciling closed issue #$NUM ---"
              ./scripts/reconcile-board-status.sh "$NUM" || echo "Failed to reconcile #$NUM — continuing"
            done

      - name: Run Claude — analyze and act
        if: steps.precheck.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          AGENT_PROMPT=$(cat .claude/agents/pipeline-monitor.md)
          # Pipeline monitor is self-contained — no common context needed
          claude --dangerously-skip-permissions --model claude-sonnet-4-6 -p "
          $AGENT_PROMPT

          ## Task
          Read input/pipeline_context.md — current state of all issues, PRs, and workflow runs.
          Repository: $REPO
          Start by reading input/pipeline_context.md carefully.
          "
