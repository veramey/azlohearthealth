name: Workflow Failure Reporter

on:
  workflow_run:
    workflows:
      - "Intake Agent"
      - "Story Refinement"
      - "Design Refinement"
      - "Issue Breakdown"
      - "Test Cases Generator"
      - "AI Teammate"
      - "Bug Check"
      - "PR Rework"
      - "Close Parent Issue"
      - "Unit Tests"
      - "Merge Trigger"
    types: [completed]

permissions:
  issues: write

jobs:
  report-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Extract issue number
        id: issue
        run: |
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          RUN_NAME="${{ github.event.workflow_run.display_title }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          # Try branch name: feature/issue-N or hotfix/issue-N
          ISSUE=$(echo "$BRANCH" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || echo "")

          # Try run name: "#N" or "Issue #N" or "Intake #N"
          if [ -z "$ISSUE" ]; then
            ISSUE=$(echo "$RUN_NAME" | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | head -1 || echo "")
          fi

          echo "Branch: $BRANCH"
          echo "Run name: $RUN_NAME"
          echo "Extracted issue: $ISSUE"
          echo "number=${ISSUE}" >> $GITHUB_OUTPUT

      - name: Comment on issue and add pipeline-error
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          REPO="${{ github.repository }}"

          gh label create "pipeline-error" --color "d73a4a" --description "Workflow failure — orchestrator will retry" \
            --repo $REPO 2>/dev/null || true

          gh issue comment $ISSUE \
            --repo $REPO \
            --body "**Workflow ${CONCLUSION}: \`${WORKFLOW}\`**

          The automated pipeline encountered an error. The orchestrator will attempt to retry.

          [View run logs](${RUN_URL})

          _Reported by Workflow Failure Reporter_"

          # Add pipeline-error label to trigger orchestrator retry
          gh issue edit $ISSUE \
            --repo $REPO \
            --add-label "pipeline-error" 2>/dev/null || true

      - name: Log no issue found
        if: steps.issue.outputs.number == ''
        run: |
          echo "Could not extract issue number — no comment posted"
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Run name: ${{ github.event.workflow_run.display_title }}"
